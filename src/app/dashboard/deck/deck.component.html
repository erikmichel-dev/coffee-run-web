<div class="container">
  <h1>Collected card deck</h1>
  <div class="slider">
    <ng-container *ngFor="let coffeCard of collectedCardDeck$ | async; let i = index">
      <div class="item" #deckCards>
        <app-coffee-card [brewedCoffee]="coffeCard" (click)="selectCard(i)">
        </app-coffee-card>
      </div>
    </ng-container>
  </div>
</div>
